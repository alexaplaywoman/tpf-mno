<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Reserva</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/calendario.css">
    <link rel="stylesheet" href="css/admin.css">
    
</head>

<body>

    <nav class="navbar navbar-dark bg-secondary px-3">
        <a id="inicio" class="btn btn-dark btn-sm" href="#">
            Atrás
        </a>
    </nav>

    <div class="container mt-5">

        <div class="card shadow mx-auto" style="max-width: 600px;">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Actualizar Reserva
                </h2>

                <p class="text-muted text-center small">
                    Solo se puede cambiar el estado, <br>
                    (Al poner el estado en cancelada aparecen los motivos de cancelación).
                </p>

                <form id="update-reserva-form">

                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select id="estado" class="form-control" required>
                            <option value="">Seleccione un estado</option>
                        </select>
                    </div>

                    <div class="mb-3" id="grupoMotivoCancelacion" style="display:none;">
                        <label class="form-label">Motivo Cancelación</label>
                        <select id="motivoCancelacion" class="form-control">
                            <option value="">Seleccione el motivo de cancelación</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">
                        Actualizar Reserva
                    </button>

                    <div id="error-message" class="text-danger text-center mt-3"></div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/upd_reserva.js"></script>

</body>
</html>
